<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmarkit</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="capture-row" aria-label="Save current page">
        <fieldset class="rank-radios">
          <legend class="sr-only">Initial rank</legend>
          <label><input type="radio" name="rank" value="tbr-candidate" checked /> <span>TBR?</span></label>
          <label><input type="radio" name="rank" value="tbr" /> <span>TBR</span></label>
        </fieldset>
        <button id="bookmark-button" class="bookmark-button" type="button">Bookmarkit</button>
      </header>

      <section id="existing-panel" class="existing-panel" hidden aria-labelledby="existing-heading">
        <p id="existing-heading" class="eyebrow">Already in library</p>
        <div class="rank-editor">
          <label class="sr-only" for="rank-select">Current rank</label>
          <div class="select-wrap">
            <select id="rank-select" aria-label="Change bookmark rank">
              <option value="tbr-candidate">TBR?</option>
              <option value="tbr">TBR</option>
              <option value="s">S</option>
              <option value="a">A</option>
              <option value="b">B</option>
            </select>
          </div>
          <button id="delete-button" class="text-button danger" type="button">Delete</button>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <nav class="actions" aria-label="Bookmark actions">
        <button id="random-button" class="primary-action" type="button">Open Random Bookmark</button>
        <button id="latest-button" class="primary-action" type="button">Open Latest Bookmark</button>
        <button id="library-button" class="primary-action library-action" type="button">Open Library</button>
      </nav>

      <footer class="footer">
        <a id="feedback-link" class="footer-link" href="#" target="_blank" rel="noreferrer">Share feedback</a>
        <div class="footer-right">
          <button id="import-button" class="footer-link" type="button">Import</button>
          <button id="export-button" class="footer-link" type="button">Export</button>
        </div>
      </footer>

      <input id="import-file" class="sr-only" type="file" accept="application/json,.json" />
      <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-heading">
        <form method="dialog">
          <h2 id="import-heading">Import bookmarks</h2>
          <fieldset>
            <legend>Choose how to import</legend>
            <label><input type="radio" name="import-mode" value="merge" checked /> <span><strong>Merge</strong> — keep local bookmarks when URLs match</span></label>
            <label><input type="radio" name="import-mode" value="replace" /> <span><strong>Replace</strong> — delete the current library first</span></label>
          </fieldset>
          <div class="dialog-actions">
            <button class="text-button" value="cancel" type="submit">Cancel</button>
            <button id="choose-import-file" class="dialog-primary" value="default" type="button">Choose JSON file</button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bookmarkit</title>
  </head>
  <body>
    <main class="popup-shell">
      <nav class="popup-nav" aria-label="Bookmark actions">
        <button id="random-button" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
            <circle cx="12" cy="6.6" r="0.75" fill="currentColor" stroke="none" />
            <circle cx="7.5" cy="12.6" r="0.75" fill="currentColor" stroke="none" />
            <circle cx="7.5" cy="16.6" r="0.75" fill="currentColor" stroke="none" />
            <circle cx="18.6" cy="11" r="0.75" fill="currentColor" stroke="none" />
            <circle cx="16.5" cy="14.6" r="0.75" fill="currentColor" stroke="none" />
            <circle cx="14.4" cy="18.2" r="0.75" fill="currentColor" stroke="none" />
          </svg>
          Random
        </button>
        <button id="latest-button" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          Latest
        </button>
        <button id="library-button" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
          Library
        </button>
      </nav>

      <section class="page-meta">
        <h1 id="page-title">This page</h1>
        <p id="page-host" class="page-host"></p>
      </section>

      <fieldset class="tier-pills">
        <legend class="sr-only">Tier</legend>
        <label><input type="radio" name="tier" value="tbr-candidate" checked /> TBR?</label>
        <label><input type="radio" name="tier" value="tbr" /> TBR</label>
        <label class="finished-tier" hidden><input type="radio" name="tier" value="s" /> S</label>
        <label class="finished-tier" hidden><input type="radio" name="tier" value="a" /> A</label>
        <label class="finished-tier" hidden><input type="radio" name="tier" value="b" /> B</label>
      </fieldset>

      <button id="bookmark-button" class="bookmark-button" type="button">Bookmarkit</button>
      <button id="delete-button" class="remove-button" type="button" hidden>Remove bookmark</button>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bookmarkit Library</title>
  </head>
  <body class="library-page">
    <main class="library-shell">
      <header class="library-header">
        <h1>Your library</h1>
        <div class="library-meta">
          <nav class="library-actions" aria-label="Library actions">
            <button id="import-button" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
              </svg>
              Import
            </button>
            <button id="export-button" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
              </svg>
              Export
            </button>
            <a id="feedback-link" href="#" target="_blank" rel="noreferrer">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
              </svg>
              Share feedback
            </a>
          </nav>
          <p id="library-status" class="library-status" role="status" aria-live="polite"></p>
        </div>
      </header>

      <section class="library-controls" aria-label="Library controls">
        <label class="search-control">
          <span class="sr-only">Search title or URL</span>
          <input id="search-input" type="search" placeholder="Search by title or URL" autocomplete="off" />
        </label>
        <div class="filter-control">
          <button type="button" id="tier-filter-button" class="filter-button" popovertarget="tier-options">
            <span id="tier-filter-label">TBR</span>
          </button>
          <div id="tier-options" class="tier-options" popover="auto" aria-label="Filter by tier">
            <label><input id="all-tiers" type="checkbox" /> All tiers</label>
            <label><input type="checkbox" value="tbr-candidate" /> TBR?</label>
            <label><input type="checkbox" value="tbr" checked /> TBR</label>
            <label><input type="checkbox" value="s" /> S</label>
            <label><input type="checkbox" value="a" /> A</label>
            <label><input type="checkbox" value="b" /> B</label>
          </div>
        </div>
      </section>

      <section class="library-grid" aria-label="Saved bookmarks">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Title</th>
                <th scope="col" class="tier-column">Tier</th>
                <th scope="col" class="date-column" aria-sort="descending">
                  <button id="date-sort" class="sort-button" type="button">Date <span aria-hidden="true">↓</span></button>
                </th>
                <th scope="col" class="delete-column">Delete</th>
              </tr>
            </thead>
            <tbody id="bookmark-rows"></tbody>
          </table>
        </div>
        <p id="empty-state" class="empty-state" hidden></p>
        <button id="empty-import" type="button" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
          </svg>
          Import
        </button>
      </section>

      <input id="import-file" class="sr-only" type="file" accept="application/json,.json" />
      <div id="undo-toast" class="undo-toast" popover="manual">
        <span>Bookmark deleted.</span>
        <button id="undo-button" type="button">Undo</button>
      </div>
    </main>
    <script type="module" src="/src/library.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bookmarkit Library</title>
  </head>
  <body class="library-page">
    <main class="library-shell">
      <header class="library-header">
        <h1>Your library</h1>
        <p id="library-status" class="library-status" role="status" aria-live="polite"></p>
      </header>

      <section class="library-controls" aria-label="Library controls">
        <label class="search-control">
          <span class="sr-only">Search title or URL</span>
          <input id="search-input" type="search" placeholder="Search by title or URL" autocomplete="off" />
        </label>
        <div class="filter-control">
          <button type="button" id="rank-filter-button" class="filter-button" popovertarget="rank-options">
            <span id="rank-filter-label">TBR</span>
          </button>
          <div id="rank-options" class="rank-options" popover="auto" aria-label="Filter by rank">
            <label><input id="all-ranks" type="checkbox" /> All ranks</label>
            <label><input type="checkbox" value="tbr-candidate" /> TBR?</label>
            <label><input type="checkbox" value="tbr" checked /> TBR</label>
            <label><input type="checkbox" value="s" /> S</label>
            <label><input type="checkbox" value="a" /> A</label>
            <label><input type="checkbox" value="b" /> B</label>
          </div>
        </div>
      </section>

      <section class="library-grid" aria-label="Saved bookmarks">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Title</th>
                <th scope="col" class="rank-column">Rank</th>
                <th scope="col" class="date-column" aria-sort="descending">
                  <button id="date-sort" class="sort-button" type="button">Date <span aria-hidden="true">↓</span></button>
                </th>
                <th scope="col" class="delete-column">Delete</th>
              </tr>
            </thead>
            <tbody id="bookmark-rows"></tbody>
          </table>
        </div>
        <p id="empty-state" class="empty-state" hidden></p>
      </section>

      <div id="undo-toast" class="undo-toast" popover="manual">
        <span>Bookmark deleted.</span>
        <button id="undo-button" type="button">Undo</button>
      </div>
    </main>
    <script type="module" src="/src/library.ts"></script>
  </body>
</html>
